<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container in Brand Red -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#redGrad)" filter="url(#subtleDrop)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Iconic HVAC Cooling Mark in Pure Crisp White -->
  <g transform="translate(32, 32)">
    <!-- Central Cooling Core -->
    <circle r="4.2" fill="#FFFFFF"/>
    <circle r="2.2" fill="#dc2626"/>

    <!-- 6 Snowflake / Fan Blades with Precision Chevron Arrows -->
    <!-- Axis 1 (0 deg - Vertical Top) -->
    <g>
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Axis 2 (60 deg) -->
    <g transform="rotate(60)">
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Axis 3 (120 deg) -->
    <g transform="rotate(120)">
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Axis 4 (180 deg - Vertical Bottom) -->
    <g transform="rotate(180)">
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Axis 5 (240 deg) -->
    <g transform="rotate(240)">
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Axis 6 (300 deg) -->
    <g transform="rotate(300)">
      <line x1="0" y1="-4.2" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M-5.5 -13.5 L0 -19 L5.5 -13.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-21" r="1.8" fill="#FFFFFF"/>
      <path d="M-3.5 -8 L0 -11.5 L3.5 -8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Dynamic Cooling Wind Arc Overlay (White / Translucent) -->
    <path d="M -16 14 A 20 20 0 0 1 18 -12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="32 10" opacity="0.75"/>
  </g>
</svg>